name: CI

# Runs every quality gate from the project rules in parallel:
#
#   - Pint (format)
#   - Larastan Level 10 + strict + deprecation rules (static analysis)
#   - PHPUnit + coverage gate (>= 90% line coverage on `app/`)
#   - composer audit (any advisory in production deps = fail)
#   - Semgrep SAST (PHP, Laravel security, and GitHub Actions rule packs)
#   - App version sync (composer.json vs OpenAPI; tag on release builds)
#   - OpenAPI example verification (live responses vs docs/openapi.yaml)
#
# Each gate is its own job so a failure in one (e.g. a Pint nit) does not
# mask failures in another (e.g. a Larastan regression). All jobs are
# read-only against the repository.

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

# Cancel an in-flight CI run for a branch when a newer commit lands:
# only the freshest result matters.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

env:
    # Human-readable tool output in Actions logs (not agent JSON from laravel/pao).
    PAO_DISABLE: 'true'
    # Exists only for the report-only SARIF re-run in the `zizmor` job, which
    # needs `--format sarif` to report rather than block; the blocking audit
    # itself (and the documented local command) reads the pin from
    # `scripts/run-zizmor.sh`. The wrapper takes this value from the
    # environment, so CI overrides its default rather than the two disagreeing.
    ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9

jobs:
    # ---------------------------------------------------------------------
    # Formatting (Pint)
    # ---------------------------------------------------------------------
    format:
        name: Pint
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version-file: '.php-version'
                  coverage: none
                  tools: composer:v2

            - name: Install Composer Dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: '--prefer-dist --no-progress'

            - name: Run Pint
              run: composer lint

            - name: Verify App Version Sync
              run: composer verify:version

            - name: Validate Composer Metadata
              run: composer lint:composer

    # ---------------------------------------------------------------------
    # Link Check (Markdown relative links and heading anchors)
    # ---------------------------------------------------------------------
    link-check:
        name: Link Check
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Lock File Engines Are In Sync
              # `npm ci` verifies the dependency tree and never the root package's own
              # `engines`, so a stale range survives it silently. Refreshing the lock and
              # diffing it is not a check either: npm rewrites the root `name` from the
              # checkout directory, so a clone and CI disagree on the same commit.
              run: npm run lint:npm

            - name: Check Markdown Links
              run: composer lint:links

    # ---------------------------------------------------------------------
    # Frontend Build (Vite, across the Node lines engines.node declares)
    # ---------------------------------------------------------------------
    frontend:
        name: Frontend Build
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                # The floor `engines.node` declares, plus the LTS and Current
                # lines, so the support range is verified rather than asserted.
                # `.nvmrc` keeps local development on the 22 line, and the other
                # Node jobs read it.
                node-version: ['22.12.0', '24', '26']
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Build Assets
              run: npm run build

    # ---------------------------------------------------------------------
    # Static Analysis (Larastan, PHPStan Level 10 + Strict + Deprecation)
    # ---------------------------------------------------------------------
    static-analysis:
        name: Larastan (Level 10)
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version-file: '.php-version'
                  coverage: none
                  tools: composer:v2

            - name: Install Composer Dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: '--prefer-dist --no-progress'

            - name: Run Larastan
              run: ./vendor/bin/phpstan analyse --memory-limit=512M --error-format=github

            - name: Check Runtime Version Parity
              # One PHP patch across `composer.json`, the Sail image and every job: a version
              # that moves in one place and not the others fails here rather than in a build
              # (scripts/lint/check-php-version-parity.php).
              run: composer verify:php-version

            - name: Check PHP CVE Patch Floor
              # The runtime this job analyses with has to be at or above the patched floor for
              # its PHP line, so a runner that silently resolved an older patch fails here
              # rather than at test time (scripts/lint/check-php-cve-floor.php).
              run: composer verify:php-cve-floor

    # ---------------------------------------------------------------------
    # Tests (PHPUnit, Against a Real MySQL Service) + Coverage
    #
    # Runs the full PHPUnit suite with pcov enabled and writes a Clover
    # XML report under `storage/coverage/`, then fails the job if the
    # overall line coverage of `app/` drops below the project floor
    # (90%, enforced by `scripts/check-coverage-threshold.php`).
    # ---------------------------------------------------------------------
    tests:
        name: PHPUnit + Coverage
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 15

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_USER: sail
                    MYSQL_PASSWORD: password
                    MYSQL_DATABASE: testing
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version-file: '.php-version'
                  extensions: pdo, pdo_mysql, mbstring, intl, bcmath, exif
                  coverage: pcov
                  tools: composer:v2

            - name: Install Composer Dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: '--prefer-dist --no-progress'

            # `.env.ci` is the single source of truth for CI environment
            # configuration. Values needed for the MySQL service exposed
            # by this workflow (DB_HOST=127.0.0.1, etc.) live there, not
            # inline in this YAML.
            - name: Prepare .env
              run: |
                  cp .env.ci .env
                  php artisan key:generate --force

            - name: Run PHPUnit With Coverage Gate
              run: composer test:coverage:check

            - name: Upload Clover Report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: php-coverage-clover
                  path: storage/coverage/clover.xml
                  if-no-files-found: warn
                  retention-days: 14

    # ---------------------------------------------------------------------
    # Security Audit (composer audit)
    #
    # Fails the job if any advisory is found for a production dependency.
    # ---------------------------------------------------------------------
    audit:
        name: Security Audit
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version-file: '.php-version'
                  coverage: none
                  tools: composer:v2

            - name: Install Composer Dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: '--prefer-dist --no-progress'

            - name: Run Composer Audit
              run: composer audit --locked --no-ansi

    # ---------------------------------------------------------------------
    # OpenAPI Examples (Live Envelope Shape vs docs/openapi.yaml)
    # ---------------------------------------------------------------------
    # QUEUE_CONNECTION=redis is set at the job level (env vars override
    # `.env` values; nothing here runs config:cache): the verifier replays
    # examples against the production queue contract, where a webhook ping
    # answers 202 with the pending delivery (null last_error /
    # last_status_code). `.env.ci` keeps sync for the PHPUnit job, where
    # queued listeners must run inline to be assertable - this served app is
    # the only place the queue contract differs, and the verify script drains
    # the queue itself before asserting the drained delivery listing.
    openapi-examples:
        name: OpenAPI Examples
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 15
        env:
            QUEUE_CONNECTION: redis

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_USER: sail
                    MYSQL_PASSWORD: password
                    MYSQL_DATABASE: testing
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version-file: '.php-version'
                  extensions: pdo, pdo_mysql, mbstring, intl, bcmath, exif
                  coverage: none
                  tools: composer:v2

            - name: Install Composer Dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: '--prefer-dist --no-progress'

            - name: Prepare .env
              run: |
                  cp .env.ci .env
                  php artisan key:generate --force

            - name: Migrate and Seed
              run: |
                  php artisan migrate --force --seed

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - name: Install PyYAML for Example Verification
              run: pip install pyyaml

            - name: Start API Server
              run: php artisan serve --host=127.0.0.1 --port=8000 &

            - name: Wait for API Server
              run: |
                  for _attempt in $(seq 1 30); do
                      if curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/users | grep -qE '401|403'; then
                          echo "API Server Is Ready"
                          exit 0
                      fi
                      sleep 1
                  done
                  echo "::error::API Server Did Not Become Ready"
                  exit 1

            - name: Verify OpenAPI Examples
              env:
                  ARTISAN_CMD: php artisan
                  OPENAPI_VERIFY_BASE: http://127.0.0.1:8000/api
              run: bash scripts/verify-openapi-examples.sh

    # ---------------------------------------------------------------------
    # SAST - Semgrep (PHP + GitHub Actions)
    # ---------------------------------------------------------------------
    semgrep:
        name: Semgrep
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 15
        permissions:
            # upload-sarif calls GET /actions/runs/{run_id} on private repos (telemetry + metadata)
            actions: read
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Scan PHP, Laravel, and GitHub Actions
              id: scan
              run: bash scripts/semgrep.sh --sarif --output semgrep.sarif

            - name: Upload SARIF
              if: >-
                  always() &&
                  (github.event_name != 'pull_request' ||
                  github.event.pull_request.head.repo.full_name == github.repository)
              # Code scanning upload needs GHAS on private repos; the scan step below is the merge gate
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  sarif_file: semgrep.sarif
                  category: semgrep

            - name: Require A Clean Scan
              if: always()
              run: |
                  if [ "${{ steps.scan.outcome }}" != "success" ]; then
                      echo "::error::Semgrep Findings Must Be Resolved Before Merge"
                      exit 1
                  fi

    # ---------------------------------------------------------------------
    # SAST - Zizmor (GitHub Actions Supply Chain)
    # ---------------------------------------------------------------------
    zizmor:
        name: Zizmor
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 15
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Audit Workflows
              id: audit
              # The wrapper owns the image pin, the config and the scope, so the documented
              # local command and this gate cannot drift apart (scripts/run-zizmor.sh).
              run: bash scripts/run-zizmor.sh

            # SARIF output always exits 0, so the gate above runs plain output and
            # this step re-runs for the upload file only.
            - name: Write SARIF Report
              if: always()
              run: |
                  docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "${{ env.ZIZMOR_IMAGE }}" \
                    --config /repo/.github/zizmor.yml --format sarif /repo/.github/workflows/ > zizmor.sarif

            - name: Upload SARIF
              if: >-
                  always() &&
                  (github.event_name != 'pull_request' ||
                  github.event.pull_request.head.repo.full_name == github.repository)
              # Code scanning upload needs GHAS on private repos; the Require step below is the merge gate
              continue-on-error: true
              # Pinned third-party action per .github/zizmor.yml policy.
              uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  sarif_file: zizmor.sarif
                  category: zizmor

            - name: Require A Clean Audit
              if: always()
              run: |
                  if [ "${{ steps.audit.outcome }}" != "success" ]; then
                      echo "::error::Zizmor Findings Must Be Resolved Before Merge"
                      exit 1
                  fi

    # ---------------------------------------------------------------------
    # Dockerfile Lint (hadolint)
    #
    # hadolint is the only gate that reads the file the local stack is built
    # from, `docker/8.5/Dockerfile`. The exceptions that file deliberately
    # takes are named with their reasons in `.hadolint.yaml`.
    # ---------------------------------------------------------------------
    hadolint:
        name: Hadolint
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Lint the Dockerfile
              # The wrapper owns the image pin, the failure threshold and the target, so
              # the documented local command and this gate cannot drift apart
              # (scripts/run-hadolint.sh).
              run: bash scripts/run-hadolint.sh

    # ---------------------------------------------------------------------
    # Shell Lint (shellcheck)
    #
    # The scripts this governs are the ones the bash rules govern: a tracked
    # file whose name ends in `.sh` or whose first line carries a `sh` shebang,
    # so a new script joins the gate by being committed with or without the
    # extension.
    # ---------------------------------------------------------------------
    shellcheck:
        name: ShellCheck
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Lint Shell Scripts
              # The runner holds the selection rule, the image pin and the severity, so
              # this job and the documented local command cannot drift apart
              # (scripts/run-shellcheck.sh).
              run: bash scripts/run-shellcheck.sh

    # ---------------------------------------------------------------------
    # Workflow Lint (actionlint)
    # ---------------------------------------------------------------------
    workflow-lint:
        name: Lint Workflows
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Lint Workflows
              # The wrapper owns the image pin and the scope, so the documented local
              # command and this gate cannot drift apart (scripts/run-actionlint.sh).
              run: bash scripts/run-actionlint.sh

            - name: Validate Renovate Config
              run: npx --yes -p renovate renovate-config-validator

    # ---------------------------------------------------------------------
    # Summary Gate
    #
    # Single required check for branch protection - fails when any job above
    # fails, is cancelled, or is skipped.
    # ---------------------------------------------------------------------
    ci:
        name: All Quality Gates
        runs-on: ${{ vars.GH_RUNNER_NAME || 'ubuntu-26.04' }}
        timeout-minutes: 5
        needs: [format, link-check, frontend, static-analysis, tests, audit, openapi-examples, semgrep, zizmor, hadolint, shellcheck, workflow-lint]
        if: always()
        steps:
            - name: Require Every Gate to Pass
              run: |
                  failed=0
                  check() {
                      if [ "$2" != "success" ]; then
                          echo "::error::Quality Gate Did Not Succeed: $1 (result: $2)"
                          failed=1
                      fi
                  }
                  check "Pint" "${{ needs.format.result }}"
                  check "Link Check" "${{ needs.link-check.result }}"
                  check "Frontend Build" "${{ needs.frontend.result }}"
                  check "Larastan" "${{ needs.static-analysis.result }}"
                  check "PHPUnit + Coverage" "${{ needs.tests.result }}"
                  check "Security Audit" "${{ needs.audit.result }}"
                  check "OpenAPI Examples" "${{ needs.openapi-examples.result }}"
                  check "Semgrep" "${{ needs.semgrep.result }}"
                  check "Zizmor" "${{ needs.zizmor.result }}"
                  check "Hadolint" "${{ needs.hadolint.result }}"
                  check "ShellCheck" "${{ needs.shellcheck.result }}"
                  check "Lint Workflows" "${{ needs.workflow-lint.result }}"
                  if [ "$failed" -ne 0 ]; then
                      exit 1
                  fi
                  echo "All Quality Gates Passed"
