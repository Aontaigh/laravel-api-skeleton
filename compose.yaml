services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            # `node_modules` is a volume of its own rather than part of the bind mount. It holds Linux
            # native modules (Rolldown, Tailwind's oxide), so a shared directory means one `npm ci` on
            # the host replaces them, and every JavaScript command in the container then fails with a
            # missing native binding until the tree is rebuilt. The container owns this copy and
            # installs it with `./vendor/bin/sail npm ci` (see docs/testing.md).
            - 'sail-node-modules:/var/www/html/node_modules'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    mysql:
        # MySQL 8.4 LTS at its newest published patch, digest-pinned so the patch cannot move under the
        # lock file. 8.4 is the LTS every managed MySQL offers and is supported to 2032; 9.7 is the
        # newer LTS line for a consumer who wants it, and 26.7 is Innovation rather than LTS.
        image: 'mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        # Valkey, the Linux Foundation fork of Redis OSS 7.2: wire-compatible with the protocol the app
        # speaks through phpredis, and BSD-licensed rather than AGPL. `redis:8.8-alpine` is the drop-in
        # alternative. The service name stays `redis` so every `REDIS_*` variable keeps working, and
        # `sail-redis` must be recreated when this line changes: a Redis 8 RDB is not readable here.
        image: 'valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-node-modules:
        driver: local
