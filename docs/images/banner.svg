<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Laravel API Starter banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <path d="M 0 0 L 160 0 M 0 0 L 0 90" stroke="#f97316" stroke-width="4" fill="none"/>
  <path d="M 1200 300 L 1040 300 M 1200 300 L 1200 210" stroke="#6366f1" stroke-width="4" fill="none"/>
  <circle cx="1080" cy="60" r="5" fill="#f97316" opacity="0.8"/>
  <circle cx="1110" cy="85" r="3" fill="#6366f1" opacity="0.8"/>
  <circle cx="130" cy="230" r="4" fill="#6366f1" opacity="0.7"/>

  <text x="600" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="1">Laravel API Starter</text>

  <rect x="440" y="150" width="320" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#94a3b8">Sanctum Auth · Spatie Permissions · Query-Driven Resources</text>
  <text x="600" y="224" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748b">OpenAPI 3.1 · Scalar Docs · 90% Coverage Gate · Dockerised Via Sail</text>

  <text x="600" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ff2d20" opacity="0.85">LARAVEL 13 · PHP 8.5</text>
</svg>
