                      data:
                        $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/UserUpdateSuccess'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

    delete:
      tags: [Users]
      summary: Soft-Delete User
      description: |
        Soft-deletes the user (`deleted_at` set). Requires `users.delete`.
        Callers cannot delete their own account. Soft-deleted users disappear
        from the index and return `404` on show.
      operationId: deleteUser
      responses:
        '200':
