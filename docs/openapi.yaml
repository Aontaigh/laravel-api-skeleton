        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

    patch:
      tags: [Users]
      summary: Update User
      description: |
        Update `name` and optionally `team_id`. Requires `users.update`.

        - At least one of `name` or `team_id` is required
        - `email` and `password` are **prohibited**
        - `team_id` requires `users.reassign-team` (Admin only)
        - Plain-text markup in `name` is stripped before validation

        Managers may update users on their own team (including themselves).
        Regular Users cannot update any account.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated User
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
