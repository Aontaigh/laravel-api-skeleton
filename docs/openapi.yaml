    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum Personal Access Token

  parameters:
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: User Primary Key

    TokenId:
      name: token
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Personal Access Token Primary Key (`personal_access_tokens.id`)

    RoleId:
      name: role
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Role Primary Key

    ApiClientId:
      name: client
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: API Client Primary Key

    AuthAuditLogId:
      name: auth_audit_log
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Auth Audit Log Primary Key

    TeamId:
      name: team
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Team Primary Key

    QueryPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Pagination Page (Offset Pagination)

    QueryPerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page Size (Hard Maximum 100)

    QueryFilterSearch:
      name: filter[search]
      in: query
      schema:
        type: string
        maxLength: 255
      description: |
        Partial Match on `name`. For Users, Also Matches `email`. Only `search` Is
        Allowed Under `filter[…]`; Other Keys Return `422`.

    QueryFilterSearchAuthAuditLogs:
      name: filter[search]
      in: query
      schema:
        type: string
        maxLength: 255
      description: |
        Partial Match on `email`. Allowed `filter[…]` Keys: `search`, `event`,
        `user_id`, `api_client_id`.

    QueryFilterAuditEvent:
      name: filter[event]
      in: query
      schema:
        type: string
        enum:
          - Login
          - Login Failed
          - Logout
          - Forced Logout
          - Register
          - Remember Me Login
          - Client Token Exchange
          - Client Token Exchange Failed
      description: Exact Match on the Persisted Event Value.

    QueryFilterUserId:
      name: filter[user_id]
      in: query
      schema:
        type: integer
      description: Exact Match on `user_id`.

    QueryFilterApiClientId:
      name: filter[api_client_id]
      in: query
      schema:
        type: integer
      description: Exact Match on `api_client_id`.

    QuerySortUsers:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - id
          - -id
          - name
          - -name
          - email
          - -email
          - created_at
          - -created_at
        default: id
      description: Sort Column; Prefix Hyphen for Descending. Default `id` Ascending.

    QuerySortRoles:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - id
          - -id
          - name
          - -name
          - created_at
          - -created_at
        default: id

    QuerySortPermissions:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - id
          - -id
          - name
          - -name
        default: id

    QuerySortTokens:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - id
          - -id
          - name
          - -name
          - created_at
          - -created_at
          - last_used_at
          - -last_used_at
          - expires_at
          - -expires_at
        default: id

    QuerySortApiClients:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - id
          - -id
          - name
          - -name
          - created_at
          - -created_at
          - last_used_at
          - -last_used_at
        default: id

    QuerySortAuthAuditLogs:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - id
          - -id
          - event
          - -event
          - email
          - -email
          - user_id
          - -user_id
          - api_client_id
          - -api_client_id
          - created_at
          - -created_at
        default: -id

    QuerySortTeams:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - id
          - -id
          - name
          - -name
          - created_at
          - -created_at
        default: id

    QueryIncludeUsers:
      name: include
      in: query
      schema:
        type: string
        example: team,role
      description: |
        Comma-Separated Eager Loads. Allowed: `team`, `role`. Spaces After Commas
        Are Trimmed.

    QueryIncludeRoles:
      name: include
      in: query
      schema:
        type: string
        example: permissions
      description: Comma-Separated Eager Loads. Allowed Permissions.

    QueryIncludeAuthAuditLogs:
      name: include
      in: query
      schema:
        type: string
        example: user
      description: Comma-Separated Eager Loads. Allowed `user`.

    QueryFieldsUsers:
      name: fields[users]
      in: query
      schema:
        type: string
        example: id,name,created_at
      description: |
        Sparse Fieldset for User Columns. Allowed: `id`, `name`, `created_at`;
        Plus `email` When the Viewer Holds `users.view-email`.

    QueryFieldsTeams:
      name: fields[teams]
      in: query
      schema:
        type: string
        example: id,name
      description: Sparse Fieldset for Nested Team When `include=team`. Allowed Columns `id`, `name`.

    QueryFieldsRoles:
      name: fields[roles]
      in: query
      schema:
        type: string
        example: id,name
      description: |
        Sparse Fieldset for Role Columns (User `role` Include or Role Index/Show).
        Allowed: `id`, `name`, `created_at`.

    QueryFieldsPermissions:
      name: fields[permissions]
      in: query
      schema:
        type: string
        example: id,name
      description: |
        Sparse Fieldset for Permission Columns (Permission Index or nested
        `permissions` on Roles). Allowed: `id`, `name`.

    QueryFieldsTokens:
      name: fields[tokens]
      in: query
      schema:
        type: string
        example: id,name,abilities,created_at
      description: |
        Sparse Fieldset for Token Columns. Allowed: `id`, `name`, `abilities`,
        `last_used_at`, `expires_at`, `created_at`.

    QueryFieldsApiClients:
      name: fields[api_clients]
      in: query
      schema:
        type: string
        example: id,name,client_id,abilities,is_active
      description: |
        Sparse Fieldset for API Client Columns. Allowed: `id`, `name`, `client_id`,
        `abilities`, `is_active`, `last_used_at`, `created_at`.

    QueryFieldsAuthAuditLogs:
      name: fields[auth_audit_logs]
      in: query
      schema:
        type: string
        example: id,event,email,created_at
      description: |
        Sparse Fieldset for Auth Audit Log Columns. Allowed: `id`, `user_id`, `event`,
        `email`, `ip_address`, `user_agent`, `personal_access_token_id`,
        `api_client_id`, `remember_me`, `created_at`.

  schemas:
    SuccessEnvelope:
      type: object
      required: [status, status_code, message, data, meta]
      properties:
        status:
          type: string
          const: success
          example: success
        status_code:
          type: integer
          example: 200
        message:
          type: string
          description: Title Case With No Trailing Period
        data: {}
        meta:
          type: object
          additionalProperties: true
          example: {}

    ErrorEnvelope:
      type: object
      required: [status, status_code, message, data, meta]
      properties:
        status:
          type: string
          const: error
          example: error
        status_code:
          type: integer
        message:
          type: string
        data:
          type: 'null'
          example: null
        meta:
          type: object
          additionalProperties: true
          example: {}

    ValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            status_code:
              example: 422
            message:
              example: Validation Failed
            meta:
              type: object
              required: [errors]
              properties:
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                allowed:
                  type: object
                  description: Present on allow-list failures — supported values keyed to the matching error field
                  additionalProperties:
                    type: array
                    items:
                      type: string

    InvalidAbilitiesEnvelope:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            status_code:
              example: 422
            message:
              example: Invalid Token Abilities
            meta:
              type: object
              required: [invalid_abilities]
              properties:
                invalid_abilities:
                  type: array
                  items:
                    type: string
                allowed:
                  type: object
                  properties:
                    abilities:
                      type: array
                      items:
                        type: string
                      description: Registered permission names plus the unrestricted `*` wildcard

    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    PaginationMetaWrapper:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    HealthData:
      type: object
      required: [database, version]
      properties:
        database:
          type: string
          const: up
          example: up
        version:
          type: string
          example: 1.7.0
          description: Semantic version from `composer.json` (override with `APP_VERSION`)

    ApiDateTime:
      type: string
      format: date-time
      description: ISO 8601 UTC Serialisation via `ApiDateTime`

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Permission:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          $ref: '#/components/schemas/ApiDateTime'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Present Only When `include=permissions` Was Requested

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
          description: Omitted Unless the Viewer Holds `users.view-email`
        created_at:
          $ref: '#/components/schemas/ApiDateTime'
        team:
          $ref: '#/components/schemas/Team'
        role:
          $ref: '#/components/schemas/Role'

    PersonalAccessToken:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        abilities:
          type: array
          items:
            type: string
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/ApiDateTime'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/ApiDateTime'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/ApiDateTime'

    ApiClient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        client_id:
          type: string
        abilities:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/ApiDateTime'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/ApiDateTime'

    AuthAuditLog:
      type: object
      properties:
        id:
          type: integer
        user_id:
          oneOf:
            - type: integer
            - type: 'null'
        event:
          type: string
        email:
          oneOf:
            - type: string
            - type: 'null'
        ip_address:
          oneOf:
            - type: string
            - type: 'null'
        user_agent:
          oneOf:
            - type: string
            - type: 'null'
        personal_access_token_id:
          oneOf:
            - type: integer
            - type: 'null'
        api_client_id:
          oneOf:
            - type: integer
            - type: 'null'
        remember_me:
          type: boolean
        created_at:
          $ref: '#/components/schemas/ApiDateTime'
        user:
          $ref: '#/components/schemas/User'

    ClientTokenExchangeRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
          maxLength: 255
        client_secret:
          type: string
          maxLength: 255

    CreateApiClientRequest:
      type: object
      required: [name, abilities]
      properties:
        name:
          type: string
          maxLength: 255
        abilities:
          type: array
          minItems: 1
          items:
            type: string

    CreateUserRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
          description: Display Name; HTML Markup Is Stripped
        email:
          type: string
          format: email
          maxLength: 255
          description: Stored in Lowercase
        password:
          type: string
        password_confirmation:
          type: string
        role:
          type: string
          enum: [Admin, Manager, User]
          default: User
        team_id:
          type: integer
          description: Optional Team Assignment

    SendTwoFactorRequest:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [email]
          description: Delivery channel for the six-digit code; must match the user's enrolled mfa_method
        two_factor_token:
          type: string
          maxLength: 255
          description: Opaque token from login/register when session cookies are unavailable

    VerifyTwoFactorRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
        device_name:
          type: string
          maxLength: 255
        two_factor_token:
          type: string
          maxLength: 255
          description: Opaque token from login/register when session cookies are unavailable

    TwoFactorRequiredSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [two_factor_required]
              properties:
                two_factor_required:
                  type: boolean
                  const: true
                two_factor_token:
                  type: string
                  description: Opaque token for stateless send/verify when cookies are not retained

    TwoFactorStatusSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [two_factor_required, expires_at]
              properties:
                two_factor_required:
                  type: boolean
                  const: true
                expires_at:
                  type: string
                  format: date-time
                  description: When the pending challenge expires

    UpdateApiClientRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 255
        abilities:
          type: array
          minItems: 1
          items:
            type: string
        is_active:
          type: boolean

    ClientTokenExchangeData:
      type: object
      required: [token, plain_text_token, expires_in]
      properties:
        token:
          $ref: '#/components/schemas/PersonalAccessToken'
        plain_text_token:
          type: string
          description: Plaintext Bearer Value; Returned Once at Exchange Only
        expires_in:
          oneOf:
            - type: integer
              description: Token Lifetime in Seconds
            - type: 'null'

    ApiClientCreatedData:
      type: object
      required: [client, client_secret]
      properties:
        client:
          $ref: '#/components/schemas/ApiClient'
        client_secret:
          type: string
          description: Plaintext Client Secret; Returned Once at Creation Only

    ClientTokenExchangeSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ClientTokenExchangeData'

    ApiClientCreatedSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            status_code:
              example: 201
            data:
              $ref: '#/components/schemas/ApiClientCreatedData'

    TokenCreatedData:
      type: object
      required: [token, plain_text_token]
      properties:
        token:
          $ref: '#/components/schemas/PersonalAccessToken'
        plain_text_token:
          type: string
          description: Plaintext Bearer Value; Returned Once at Creation Only

    AuthenticatedUser:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
          description: Always Present for the Session Owner on Login and Registration
        created_at:
          $ref: '#/components/schemas/ApiDateTime'

    AuthSessionData:
      type: object
      required: [user, token, plain_text_token]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        token:
          $ref: '#/components/schemas/PersonalAccessToken'
        plain_text_token:
          type: string
          description: Plaintext Bearer Value; Returned Once at Creation Only

    AuthSessionSuccess:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthSessionData'

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Display Label; HTML Markup Is Stripped
        abilities:
          type: array
          items:
            type: string
          description: Registered Spatie Permission Names; Defaults to `["*"]`

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 255
          description: HTML Markup Is Stripped
        team_id:
          type: integer
          description: Requires `users.reassign-team` (Admin Only)
        email:
          type: string
          description: Prohibited
          not: {}
        password:
          type: string
          description: Prohibited
          not: {}

    UpdateMeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: HTML Markup Is Stripped
        email:
          type: string
          description: Prohibited
          not: {}
        password:
          type: string
          description: Prohibited
          not: {}
        team_id:
          type: integer
          description: Prohibited
          not: {}

    UpdateMePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          description: The Caller's Current Password for Verification
        password:
          type: string
          minLength: 8
          description: The New Password
        password_confirmation:
          type: string
          description: Must Match `password`

  responses:
    Unauthorized:
      description: Missing or Invalid Bearer Token
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  status_code:
                    example: 401
                  message:
                    example: Unauthenticated
          examples:
            default:
              $ref: '#/components/examples/UnauthorizedError'

    Forbidden:
      description: Authenticated but Not Permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: '#/components/examples/ForbiddenError'

    NotFound:
      description: Resource Not Found (or Not Visible to the Caller)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            default:
              $ref: '#/components/examples/NotFoundError'

    ValidationError:
      description: Allow-List or Payload Validation Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          examples:
            default:
              $ref: '#/components/examples/ValidationErrorExample'

    TooManyRequests:
      description: Rate Limit Exceeded
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  status_code:
                    example: 429
                  message:
                    example: Too Many Requests
