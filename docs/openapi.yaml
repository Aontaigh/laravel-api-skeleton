                        items:
                          $ref: '#/components/schemas/Team'
                      meta:
                        $ref: '#/components/schemas/PaginationMetaWrapper'
              examples:
                default:
                  $ref: '#/components/examples/TeamsIndexSuccess'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /teams/{team}:
    parameters:
      - $ref: '#/components/parameters/TeamId'

    get:
      tags: [Teams]
      summary: Show Team
      description: |
        Single team. Requires `teams.list`.

        Supports `fields[teams]` (columns `id`, `name`). No `sort`, `filter`,
        or pagination.
      operationId: showTeam
      parameters:
        - $ref: '#/components/parameters/QueryFieldsTeams'
      responses:
        '200':
          description: Team Resource
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Team Retrieved Successfully
                      data:
                        $ref: '#/components/schemas/Team'
              examples:
                default:
                  $ref: '#/components/examples/TeamShowSuccess'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

