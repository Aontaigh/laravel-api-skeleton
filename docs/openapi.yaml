openapi: 3.1.0

info:
  title: Laravel API Starter
  version: 1.7.0
  description: |
    Production-ready Laravel 13 API with Sanctum bearer authentication, Spatie
    roles and permissions, and a consistent query-driven index pattern.

    ## Authentication

    Password sign-in starts with `POST /login` or `POST /register`. When the User
    has email MFA enrolled (`mfa_method` set), the response is
    `two_factor_required` plus an opaque `two_factor_token` — complete
    `POST /two-factor/send` and `POST /two-factor/verify` before a bearer token
    is issued. Users without MFA receive a Sanctum token immediately from login.

    Machine clients use `POST /oauth/token` (client credentials). Stateful SPAs
    may restore a remember-me session via `POST /login/remember` (session cookie
    + CSRF). All other routes require `Authorization: Bearer {token}`.

    ## Response Envelope

    All JSON responses use the same shape:

    ```json
    {
      "status": "success | error",
      "status_code": 200,
      "message": "Title Case Message With No Trailing Period",
      "data": {},
      "meta": {}
    }
    ```

    - **Success** — `data` holds the payload; list endpoints add `meta.pagination`
    - **Validation Error (422)** — `meta.errors` is a field → messages map; allow-list
      failures also include `meta.allowed` with the supported values for that key
    - **Invalid Token Abilities (422)** — `meta.invalid_abilities` lists unknown ability strings

    ## Index Query Contract

    List endpoints (`GET /users`, `GET /roles`, `GET /tokens`, `GET /clients`,
    `GET /audit-logs`, `GET /permissions`, `GET /teams`) share the same query-param vocabulary.
    Unknown sort columns, filter keys, field names, or include relations return
    `422`.

    | Param | Format | Notes |
    | --- | --- | --- |
    | `sort` | `{column}` or `-{column}` | Single column; prefix `-` for descending. Whitelist is resource-specific (see each operation). Default sort is documented per resource. |
    | `fields[{resource}]` | comma-separated columns | Sparse fieldset — only listed columns are selected and returned. Keys are resource-specific (`fields[users]`, `fields[teams]`, …). Spaces after commas are trimmed. |
    | `include` | comma-separated relations | Whitelisted eager loads. Singular keys may load plural relations (e.g. `include=role` eager-loads `roles`). |
    | `filter[search]` | string (max 255) | Partial match on name (and email for users and audit logs). Only whitelisted `filter[…]` keys are accepted per resource. |
    | `page` | integer ≥ 1 | Offset pagination page (default `1`). |
    | `per_page` | integer 1–100 | Page size (default `25`). |

    ### Sparse Fieldsets and Includes

    Request nested shapes with **both** `include` and the matching `fields[…]` key:

    ```
    ?include=team,role&fields[users]=id,name&fields[teams]=id,name&fields[roles]=id,name
    ```

    Omitted `fields[…]` means all allowed columns for that resource are selected.
    Response keys are omitted when the column was not selected.

    ### Show Endpoints

    `GET /me`, `GET /users/{user}`, `GET /roles/{role}`, `GET /clients/{client}`,
    `GET /audit-logs/{auth_audit_log}`, and `GET /teams/{team}` support `include`
    and `fields[…]` only — no `sort`, `filter`, or pagination.

    ## Account Status

    Suspended accounts (`suspended_at` set) are rejected at login and OAuth
    client-credentials exchange with the generic `Invalid Credentials` validation
    message — no bearer token is issued. An existing bearer token or session
    receives `403` with message `Account Suspended` on every authenticated route
    (`active.account` middleware). Remember-me restoration answers with generic
    `401 Unauthenticated`. Admins suspend and unsuspend accounts via
    `POST /users/{user}/suspend` and `POST /users/{user}/unsuspend`
    (requires `users.suspend`).

    ## Rate Limits

    | Scope | Default limit |
    | --- | --- |
    | General API (`throttle:api`) | 500 requests / minute / user (or IP when unauthenticated) |
    | Login and registration (`POST /login`, `POST /register`) | 5 requests / minute / email+IP, plus a 20 requests / minute per-IP ceiling |
    | Two-factor send (`POST /two-factor/send`) | 5 requests / minute / pending-challenge+IP, plus a 20 requests / minute per-IP ceiling |
    | Two-factor verify (`POST /two-factor/verify`) | 5 requests / minute / pending-challenge+IP, plus a 20 requests / minute per-IP ceiling |
    | Two-factor status (`GET /two-factor/status`) | 60 requests / minute / pending-challenge+IP |
    | Client credentials (`POST /oauth/token`) | 5 requests / minute / `client_id`+IP, plus a 20 requests / minute per-IP ceiling |
    | Token creation (`POST /tokens`, `POST /users/{user}/tokens`, `POST /clients`) | 10 requests / minute / user |

    Exceeded limits return `429` with message `Too Many Requests`.

    ## Permissions

    See [docs/permissions.md](permissions.md) for the full role matrix. Policies
    enforce permissions server-side; holding a wildcard (`*`) token ability does
    **not** bypass Spatie role permissions.

  license:
    name: MIT
    identifier: MIT

servers:
  - url: /api
    description: Current Host (Local or Production)
  - url: http://localhost/api
    description: Local Development (Sail / `php artisan serve`)

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Password Login and Self-Service Registration (Public, Rate-Limited)
  - name: Users
    description: User Index, Show, Update, Soft-Delete, Suspension, Self-Service Profile, and Admin-Issued Tokens
  - name: Tokens
    description: Self-Service Personal Access Token Management
  - name: Roles
    description: Role Index and Show (Read-Only)
  - name: Teams
    description: Team Index and Show (Read-Only)
  - name: Permissions
    description: Permission Catalog for Token and API Client Ability Pickers
  - name: API Clients
    description: Admin-Managed Machine-to-Machine Client Credentials
  - name: Audit Logs
    description: Admin Read-Only Authentication Audit Trail
  - name: Health
    description: Public Uptime Probe (No Auth)

paths:
  /health:
    get:
      tags: [Health]
      summary: Health Check
      description: |
        Public uptime probe — no auth, no throttling. Returns the application
        version and whether the primary database answers `select 1`. Returns
        `503 Service Unavailable` when the database is unreachable.

        Served at the **root** (`/health`), outside the `/api` prefix.
      operationId: health
      servers:
        - url: /
          description: Root — Health Probe Bypasses the /api Prefix
      responses:
        '200':
          description: Service Healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Service Healthy
                      data:
                        $ref: '#/components/schemas/HealthData'
              examples:
                default:
                  $ref: '#/components/examples/HealthSuccess'
        '503':
          description: Service Unavailable (Database Unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                default:
                  $ref: '#/components/examples/HealthUnavailable'

  /login:
    post:
      tags: [Authentication]
      summary: Log In
      description: |
        Verify email and password credentials and return a Sanctum bearer token.
        When the User has enrolled in email two-factor authentication (`mfa_method`
        set), valid credentials return `200` with `two_factor_required: true`,
        `two_factor_token`, and no bearer token — the caller must complete
        `POST /two-factor/send` and `POST /two-factor/verify` before a session is
        issued. Pass `two_factor_token` on send and verify when the client cannot
        rely on session cookies (stateless API clients).

        Set `remember` to `true` for industry-standard remember-me: a longer-lived
        Sanctum token, a rotated `remember_token` on the User, and a web-guard
        remember cookie for stateful SPAs.

        Invalid credentials, suspended accounts, and service accounts return `422`
        with a generic `Invalid Credentials` message on the `email` field.
        Successful and failed attempts are recorded in `auth_audit_logs`
        (queued listener).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                remember:
                  type: boolean
                  description: Extend token lifetime and enable remember-me cookie recall
                device_name:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Authenticated Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionSuccess'
              examples:
                LoginSuccess:
                  $ref: '#/components/examples/LoginSuccess'
                TwoFactorRequired:
                  $ref: '#/components/examples/TwoFactorRequiredSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'

  /two-factor/send:
    post:
      tags: [Authentication]
      summary: Send Two-Factor Code
      description: |
        Dispatch a six-digit email code for the pending login challenge. Requires
        a prior `POST /login` or `POST /register` that returned
        `two_factor_required: true`. The pending challenge is bound to the caller's
        session **or** the opaque `two_factor_token` returned alongside
        `two_factor_required` — pass the token on stateless clients that do not
        retain cookies. Only `email` is supported today; the channel must match the
        user's enrolled `mfa_method`.

        Returns `422` with `Your Sign-In Session Has Expired` when no pending
        challenge exists. Suspended accounts receive `403 Account Suspended`.
      operationId: sendTwoFactorCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTwoFactorRequest'
      responses:
        '200':
          description: Code Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRequiredSuccess'
              examples:
                default:
                  $ref: '#/components/examples/TwoFactorCodeSentSuccess'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /two-factor/verify:
    post:
      tags: [Authentication]
      summary: Verify Two-Factor Code
      description: |
        Verify the six-digit code and issue a Sanctum bearer token. Requires the
        pending challenge opened by `POST /login` or `POST /register` — resolved
        from the session cookie or optional `two_factor_token`.

        Wrong, expired, or over-attempt codes return `422` with
        `Invalid or Expired Code`. Suspended accounts receive `403 Account
        Suspended`. Successful verification records `Two-Factor Verified` and
        `Login` audit events.
      operationId: verifyTwoFactorCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTwoFactorRequest'
      responses:
        '200':
          description: Authenticated Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionSuccess'
              examples:
                default:
                  $ref: '#/components/examples/LoginSuccess'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /two-factor/status:
    get:
      tags: [Authentication]
      summary: Two-Factor Status
      description: |
        Report whether a pending two-factor challenge is still active. Intended for
        SPA polling while the visitor is on the verification screen. The pending
        challenge is resolved from the session cookie or optional
        `two_factor_token` query parameter — never from email input.

        Returns `422` with `Your Sign-In Session Has Expired` when no pending
        challenge exists. Suspended accounts receive `403 Account Suspended`.
      operationId: twoFactorStatus
      security: []
      parameters:
        - name: two_factor_token
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: Opaque token from login/register when session cookies are unavailable
      responses:
        '200':
          description: Pending Challenge Active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatusSuccess'
              examples:
                default:
                  $ref: '#/components/examples/TwoFactorStatusSuccess'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /login/remember:
    post:
      tags: [Authentication]
      summary: Restore Session (Remember Me)
      description: |
        Re-authenticate a User from an active web session or remember-me cookie and
        issue a fresh long-lived Sanctum bearer token. Intended for stateful SPAs
        after a prior `POST /login` with `remember: true`. Suspended accounts and
        service accounts receive generic `401 Unauthenticated` (same as a bad
        cookie). Records a `Remember Me Login` row in `auth_audit_logs`.
      operationId: loginRemember
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Session Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /register:
    post:
      tags: [Authentication]
      summary: Register
      description: |
        Create a new User with the default `User` role, no Team assignment (`team_id`
        remains null), and auto-enrol email two-factor authentication
        (`mfa_method: email`). Email addresses are normalised to lowercase before
        validation and persistence. Returns `201` with `two_factor_required: true`
        and `two_factor_token` — no bearer token until
        `POST /two-factor/send` and `POST /two-factor/verify` complete. Email
        verification is not required — `email_verified_at` remains null.

        Duplicate email addresses return `422` with the same generic `Invalid Credentials`
        message on the `email` field as failed login — callers cannot distinguish an
        existing account from other validation failures on that field.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                password_confirmation:
                  type: string
                device_name:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Account Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRequiredSuccess'
              examples:
                RegisterPending:
                  $ref: '#/components/examples/RegisterPendingSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'

  /oauth/token:
    post:
      tags: [Authentication]
      summary: Issue Token (Client Credentials)
      description: |
        Exchange `client_id` and `client_secret` for a scoped Sanctum bearer token
        using the OAuth2 `client_credentials` grant. Tokens default to a **30**-day
        lifetime (`API_CLIENT_TOKEN_EXPIRATION_DAYS`).

        Invalid credentials and suspended service users return `422` with a generic
        `Invalid Credentials` message on the `client_id` field. Successful and
        failed exchanges are recorded in `auth_audit_logs`.
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientTokenExchangeRequest'
      responses:
        '200':
          description: Token Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTokenExchangeSuccess'
              examples:
                ClientTokenExchangeSuccess:
                  $ref: '#/components/examples/ClientTokenExchangeSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /logout:
    post:
      tags: [Authentication]
      summary: Log Out
      description: |
        End the authenticated session everywhere. Revokes **all** Sanctum Personal
        Access Tokens for the User, clears the remember-me token, deletes every
        server-side session row for that User, and invalidates the current request
        session when present (SPA cookie auth).
      operationId: logout
      responses:
        '200':
          description: Logged Out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                LogoutSuccess:
                  $ref: '#/components/examples/LogoutSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [Users]
      summary: Show Current User Profile
      description: |
        Return the authenticated User's own profile. Any bearer token holder may
        call this endpoint — `users.list` is **not** required.

        Service accounts (`is_service_account`) receive `403`.

        Supports `include` and `fields[…]` with the same allow-lists as
        `GET /users/{user}`. `email` is always available on the caller's own
        profile. No `sort`, `filter`, or pagination.
      operationId: showMe
      parameters:
        - $ref: '#/components/parameters/QueryIncludeUsers'
        - $ref: '#/components/parameters/QueryFieldsUsers'
        - $ref: '#/components/parameters/QueryFieldsTeams'
        - $ref: '#/components/parameters/QueryFieldsRoles'
      responses:
        '200':
          description: Current User Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Profile Retrieved Successfully
                      data:
                        $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/MeShowSuccess'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

    patch:
      tags: [Users]
      summary: Update Current User Profile
      description: |
        Update the authenticated User's own `name`. Any interactive bearer token
        holder may call this — `users.update` is **not** required.

        - `name` is required; `email`, `password`, and `team_id` are **prohibited**
        - Plain-text markup in `name` is stripped before validation
        - Service accounts (`is_service_account`) receive `403`
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Profile Updated Successfully
                      data:
                        $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/MeUpdateSuccess'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/password:
    patch:
      tags: [Users]
      summary: Change Current User Password
      description: |
        Change the authenticated User's own password. Any interactive bearer
        token holder may call this.

        Requires the current password to verify the change, then sets the new
        password (minimum 8 characters) and rotates the User's sessions so any
        existing session is signed out. Service accounts receive `403`.
      operationId: updateMePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMePasswordRequest'
      responses:
        '200':
          description: Password Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Password Updated Successfully
                      data:
                        type: 'null'
              examples:
                default:
                  $ref: '#/components/examples/MePasswordUpdateSuccess'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users:
    get:
      tags: [Users]
      summary: List Users
      description: |
        Paginated, filterable user list. Requires `users.list`.

        **Row Scoping:** Managers and Users see only their own team. Admins
        (`users.list-all`) see every team.

        **Sort Whitelist:** `id`, `name`, `email`, `created_at` (default `id` ascending).

        **Include Whitelist:** `team`, `role`.

        **Fields Keys:** `fields[users]`, `fields[teams]`, `fields[roles]`.

        **User Columns:** `id`, `name`, `created_at`; plus `email` when the viewer
        holds `users.view-email`. `email` is also stripped at serialisation time
        without that permission, even when `fields[users]` is omitted.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/QuerySortUsers'
        - $ref: '#/components/parameters/QueryIncludeUsers'
        - $ref: '#/components/parameters/QueryFieldsUsers'
        - $ref: '#/components/parameters/QueryFieldsTeams'
        - $ref: '#/components/parameters/QueryFieldsRoles'
        - $ref: '#/components/parameters/QueryFilterSearch'
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QueryPerPage'
      responses:
        '200':
          description: Paginated User Collection
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Users Retrieved Successfully
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      meta:
                        $ref: '#/components/schemas/PaginationMetaWrapper'
              examples:
                default:
                  $ref: '#/components/examples/UsersIndexSuccess'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    post:
      tags: [Users]
      summary: Create User
      description: |
        Admin-initiated user creation. Requires `users.create` (Admin only).

        Assigns the default `User` role when `role` is omitted. Optional `role`
        may be `Admin`, `Manager`, or `User`; optional `team_id` assigns the user
        to a team. Email addresses are normalised to lowercase before validation
        and persistence. New accounts are auto-enrolled in email two-factor
        authentication (`mfa_method: email`). `email_verified_at` remains null —
        no verification email is sent. Does not return a bearer token.

        Plain-text markup in `name` is stripped before validation.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      status_code:
                        example: 201
                      message:
                        example: User Created Successfully
                      data:
                        $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/UserCreateSuccess'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/logout:
    post:
      tags: [Users]
      summary: Force Log Out Users
      description: |
        Admin-only session termination for one or more Users by id. Requires
        `users.force-logout`.

        Revokes **all** Sanctum Personal Access Tokens for each target User,
        clears remember-me tokens, and deletes every server-side session row.
        Does not end the admin's own bearer session.
      operationId: forceLogoutUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    format: int64
      responses:
        '200':
          description: Users Logged Out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: Users Logged Out Successfully
                      data:
                        type: object
                        required: [user_ids]
                        properties:
                          user_ids:
                            type: array
                            items:
                              type: integer
                              format: int64
              examples:
                default:
                  value:
                    status: success
                    status_code: 200
                    message: Users Logged Out Successfully
                    data:
                      user_ids: [2, 5]
                    meta: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{user}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [Users]
      summary: Show User
      description: |
        Single user. Requires `users.list`. Row Scoping matches the index.

        Supports `include` and `fields[…]` (same allow-lists as `GET /users`).
        No `sort`, `filter`, or pagination.
      operationId: showUser
      parameters:
        - $ref: '#/components/parameters/QueryIncludeUsers'
        - $ref: '#/components/parameters/QueryFieldsUsers'
        - $ref: '#/components/parameters/QueryFieldsTeams'
        - $ref: '#/components/parameters/QueryFieldsRoles'
      responses:
        '200':
          description: User Resource
          content:
            application/json:
              schema:
                allOf:
